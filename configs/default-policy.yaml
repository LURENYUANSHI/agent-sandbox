# Default security policy for AgentSandbox
# This policy provides a restrictive baseline

name: default
description: Default restrictive security policy
default_effect: deny

rules:
  - name: allow-tmp-read
    effect: allow
    actions: [file]
    paths: ["/tmp/*"]
    file_ops: [read, list]

  - name: allow-tmp-write
    effect: allow
    actions: [file]
    paths: ["/tmp/*"]
    file_ops: [write]
