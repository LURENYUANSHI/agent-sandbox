name: default
version: "1.0"
description: "Default policy - deny by default, allow file ops in temp/sandbox, HTTP, and process exec; deny shell"
default_effect: deny
rules:
  - id: allow-tmp-read-write
    name: "Allow /tmp read/write/delete"
    actions: ["file:read", "file:write", "file:delete"]
    resources: ["/tmp/**", "/sandbox/**", "C:/Users/*/AppData/Local/Temp/**", "C:\\Users\\*\\AppData\\Local\\Temp\\**"]
    effect: allow
    priority: 10

  - id: allow-http-outbound
    name: "Allow HTTP to safe domains"
    actions: ["net:http"]
    resources: ["*"]
    effect: allow
    priority: 10

  - id: allow-local-process
    name: "Allow safe local commands"
    actions: ["proc:exec"]
    resources: ["*"]
    effect: allow
    priority: 10

  - id: deny-all-shell
    name: "Deny direct shell execution"
    actions: ["shell:exec"]
    resources: ["*"]
    effect: deny
    priority: 100
