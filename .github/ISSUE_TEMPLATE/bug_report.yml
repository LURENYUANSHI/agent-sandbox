name: Bug Report
description: Report a bug in AgentSandbox
title: "[Bug]: "
labels: ["type::bug", "status::backlog"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Sandbox Runtime
        - Policy Engine
        - Trace System
        - CLI
        - REST API
        - Web Dashboard
        - Docker
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, Docker version, etc.
