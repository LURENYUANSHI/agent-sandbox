version: "3.8"

services:
  agent-sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - sandbox-data:/var/lib/agent-sandbox
      - ../configs:/etc/agent-sandbox/configs
    environment:
      - SANDBOX_LOG_LEVEL=info
      - SANDBOX_TRACE_DIR=/var/lib/agent-sandbox/traces

volumes:
  sandbox-data:
